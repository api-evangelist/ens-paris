reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      ENS Paris (rue d'Ulm, Université PSL) publishes no first-party developer
      portal or documented institutional API; its official site lists academic
      and digital resources but nothing developer-facing. Confirmed live,
      relevant programmatic access is all third-party national infrastructure:
      the HAL national open archive OAI-PMH endpoint and HAL REST/Search API
      (which carry HAL-ENS deposits), and the MESR higher-education open-data
      Explore API (which lists ENS as an establishment). No GitHub org exists at
      github.com/ens-paris (404). No endpoints were fabricated; each URL below
      was probed live. LinkedIn school page included by standard slug
      (could not be fetched directly; LinkedIn returns HTTP 999 to crawlers).
    endpoints:
      - url: https://www.ens.psl.eu/en
        status: 200
        note: Official ENS website; no developer/API references found.
      - url: https://api.archives-ouvertes.fr/oai/hal/?verb=Identify
        status: 200
        note: National HAL OAI-PMH server; HAL-ENS harvestable by collection set.
      - url: https://api.hal.science/docs/
        status: 200
        note: HAL REST/Search API documentation; covers HAL-ENS records.
      - url: https://data.enseignementsup-recherche.gouv.fr/api/explore/v2.1/console
        status: 200
        note: MESR Opendatasoft Explore API console; ENS appears as establishment.
      - url: https://bib.ens.psl.eu/
        status: 200
        note: ENS library network site; no public API documented.
      - url: https://halley.ens.fr/
        status: 0
        note: Legacy library catalogue host did not resolve at review time.
      - url: https://github.com/ens-paris
        status: 404
        note: No official ENS Paris GitHub organization exists at this handle.
      - url: https://www.linkedin.com/school/ecole-normale-superieure/
        status: 999
        note: LinkedIn school page; HTTP 999 returned to automated fetch.
  - date: '2026-08-30'
    rating: 3
    method: probed
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles operator attribution
      before saving any contract. The June review's conclusion — that ENS runs no first-party API —
      was half right and half a misattribution. The MESR "Explore" contract catalogued in June is
      the Opendatasoft Explore API v2.1 (info.contact support@opendatasoft.com, license "Copyright
      Opendatasoft") deployed by the French Ministry; ENS neither operates it nor is a tenant of it,
      so both refined specs, the pre-refine original and every derived artifact were removed. In
      their place, two genuinely institution-operated machine-readable surfaces were found that the
      June pass missed: a Shibboleth SAML 2.0 identity provider at federation.ens.psl.eu registered
      in RENATER, and a Koha library catalogue at catalogue.bib.ens.psl.eu serving public REST
      routes and an OAI-PMH 2.0 provider. The catalogue's earliest OAI datestamp is 2026-05-19, so
      it went live at roughly the moment of the June review, when the legacy halley.ens.fr host was
      already dead. HAL is retained as a tenant relationship, not an ENS API.
    endpoints:
      - url: https://federation.ens.psl.eu/idp/shibboleth
        status: 200
        note: ENS-PSL SAML 2.0 IdP metadata, application/xml, 14730 bytes — institution-operated.
      - url: https://metadata.federation.renater.fr/renater/main/main-idps-renater-metadata.xml
        status: 200
        note: RENATER IdP aggregate carries the ENS entity, shibmd:Scope ens.fr + ens.psl.eu.
      - url: https://federation.ens.psl.eu/idp/profile/SAML2/Redirect/SSO
        status: 400
        note: Live SSO endpoint; 400 is correct for a request with no SAMLRequest.
      - url: https://catalogue.bib.ens.psl.eu/cgi-bin/koha/oai.pl?verb=Identify
        status: 200
        note: OAI-PMH 2.0, repositoryName "bibliothèques de l'ENS-PSL" — institution-operated.
      - url: https://catalogue.bib.ens.psl.eu/opac/oai.pl?verb=Identify
        status: 404
        note: The baseURL the OAI provider advertises for itself is unreachable from outside.
      - url: https://catalogue.bib.ens.psl.eu/api/v1/public/libraries
        status: 200
        note: Koha REST v1 public route returning real ENS branch records, no credential required.
      - url: https://catalogue.bib.ens.psl.eu/api/v1/.html
        status: 200
        note: Koha REST API reference (Swagger UI) for the ENS deployment.
      - url: 'https://api.archives-ouvertes.fr/oai/hal/?verb=ListIdentifiers&metadataPrefix=oai_dc&set=collection:ENS-PARIS'
        status: 200
        note: ENS-PARIS OAI set on the national HAL platform — tenant, operated by CCSD/CNRS.
      - url: 'https://api.archives-ouvertes.fr/search/ENS-PARIS/?q=*:*&rows=1&wt=json'
        status: 200
        note: HAL Search scoped to the ENS portal; numFound 84,784.
      - url: https://ens.figshare.com
        status: 202
        note: Empty 202 — identical to a nonsense subdomain; a wildcard, not an ENS Figshare tenancy.
      - url: https://moodle.ens.psl.eu/mod/lti/auth.php
        status: 301
        note: Institution-hosted Moodle, but LTI paths redirect to home; no LTI conformance claimed.
      - url: https://www.ens.psl.eu/jsonapi
        status: 404
        note: No JSON:API on the main Drupal site.
      - url: https://www.ens.psl.eu/llms.txt
        status: 404
        note: No llms.txt published.
      - url: https://www.ens.psl.eu/en/rss.xml
        status: 200
        note: Institution news feed, application/rss+xml.
