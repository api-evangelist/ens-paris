description: >-
  École normale supérieure - PSL (ENS, rue d'Ulm) is a French grande école and constituent
  institution of Université PSL, running 15 departments, 35 research laboratories and a
  ten-library network in the Quartier latin of Paris. ENS publishes no developer portal, no
  OpenAPI description and no API key programme, and this profile does not pretend otherwise.
  What it does operate, verified live on 2026-08-30, is two machine-readable surfaces on its own
  domain: a SAML 2.0 / Shibboleth identity provider at federation.ens.psl.eu, registered in the
  RENATER Fédération Éducation-Recherche with scopes ens.fr and ens.psl.eu; and the ENS-PSL
  library catalogue at catalogue.bib.ens.psl.eu, a Koha deployment exposing an unauthenticated
  REST API and an OAI-PMH 2.0 provider whose Identify names the repository "bibliothèques de
  l'ENS-PSL". Alongside those, ENS holds one tenant relationship worth recording — the ENS-PARIS
  collection inside the national HAL open archive, operated by CCSD/CNRS, harvestable as the
  OAI-PMH set collection:ENS-PARIS and queryable through HAL's ENS-scoped Search API. An earlier
  version of this profile credited ENS with the French Ministry of Higher Education's
  Opendatasoft Explore API; that contract is Opendatasoft's, deployed by the ministry, and it and
  everything derived from it were removed on 2026-08-30.
