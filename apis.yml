- aid: ens-paris:library-catalog
  name: ENS-PSL Library Catalogue (Koha REST + OAI-PMH)
  x-operator: institution
  description: >-
    The catalogue of the ten ENS-PSL libraries, hosted at catalogue.bib.ens.psl.eu under the
    institution's own domain and integrated by BibLibre. Two machine-readable interfaces answer
    publicly. The Koha REST API v1 serves unauthenticated /api/v1/public/* routes — verified against
    /api/v1/public/libraries, which returns the real ENS branch records with @ens.psl.eu contact
    addresses — and browses through a Swagger UI at /api/v1/.html; patron and staff routes require a
    library credential and no registration path is published. An OAI-PMH 2.0 provider at
    /cgi-bin/koha/oai.pl identifies as "bibliothèques de l'ENS-PSL" and exposes one set, CATALOGUE.
    Note the OAI provider advertises a baseURL of /opac/oai.pl which returns 404 from outside; the
    working base is the cgi-bin path recorded here. The interface contract is Koha's own — an
    open-source ILS every Koha library ships — so no OpenAPI is stored under this institution; the
    deployment, the domain and the records are ENS's.
  humanURL: https://catalogue.bib.ens.psl.eu/api/v1/.html
  baseURL: https://catalogue.bib.ens.psl.eu/api/v1/
