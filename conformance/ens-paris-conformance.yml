specification: API Evangelist Conformance
specificationVersion: '0.1'
provider: École Normale Supérieure de Paris
providerId: ens-paris
generated: '2026-08-30'
method: probed
authorship: generated by API Evangelist from live probes; not authored by the institution.
source: live HTTP probes of ENS-PSL hosts and the RENATER federation metadata aggregate
regime: education
description: >-
  Domain-standard conformance for École Normale Supérieure - PSL, established by probing live
  endpoints rather than by reading a prose claim. Each hit names the exact location that returned
  the evidence, the operator of the endpoint, and the HTTP status observed on 2026-08-30. Standards
  in the Kin Score `education` regime that were probed and NOT found are recorded under `absent`
  so the gaps are legible and are never mistaken for unchecked.
standards:
  - standard: saml
    status: conformant
    x-operator: institution
    detail: >-
      ENS-PSL operates its own SAML 2.0 Identity Provider. The entity descriptor is served directly
      by the institution and declares SingleSignOnService endpoints for the HTTP-POST and
      HTTP-Redirect bindings, plus the SAML 1.x Shibboleth AuthnRequest profile.
    evidence:
      - url: https://federation.ens.psl.eu/idp/shibboleth
        status: 200
        note: 'application/xml, 14,730 bytes — SAML 2.0 EntityDescriptor for entityID https://federation.ens.psl.eu/idp/shibboleth'
      - url: https://federation.ens.psl.eu/idp/profile/SAML2/Redirect/SSO
        status: 400
        note: 'live endpoint; 400 is the correct response to a request carrying no SAMLRequest'
  - standard: shibboleth
    status: conformant
    x-operator: institution
    detail: >-
      The IdP is a Shibboleth deployment registered in the RENATER Fédération Éducation-Recherche.
      Its federation entry carries shibmd:Scope values `ens.fr` and `ens.psl.eu` and
      OrganizationName "Ecole Normale Supérieure de Paris".
    evidence:
      - url: https://metadata.federation.renater.fr/renater/main/main-idps-renater-metadata.xml
        status: 200
        note: 'RENATER IdP aggregate contains entityID https://federation.ens.psl.eu/idp/shibboleth with shibmd:Scope ens.fr and ens.psl.eu'
      - url: https://federation.ens.psl.eu/idp/shibboleth
        status: 200
        note: 'Shibboleth IdP metadata endpoint under the institution''s own registrable domain'
  - standard: oai-pmh
    status: conformant
    x-operator: institution
    detail: >-
      The ENS-PSL library catalogue exposes an OAI-PMH 2.0 provider on the institution's own host.
      Identify returns repositoryName "bibliothèques de l'ENS-PSL"; ListSets returns one set,
      `CATALOGUE` ("Export catalogue"). The software is Koha and the adminEmail resolves to the
      integrator (biblibre.com), but the endpoint, the domain and the records are the institution's.
      Note the repository advertises a baseURL of https://catalogue.bib.ens.psl.eu/opac/oai.pl
      which returns 404 from outside; the working base is /cgi-bin/koha/oai.pl.
    evidence:
      - url: https://catalogue.bib.ens.psl.eu/cgi-bin/koha/oai.pl?verb=Identify
        status: 200
        note: 'text/xml — protocolVersion 2.0, granularity YYYY-MM-DDThh:mm:ssZ, earliestDatestamp 2026-05-19'
      - url: https://catalogue.bib.ens.psl.eu/cgi-bin/koha/oai.pl?verb=ListSets
        status: 200
        note: 'one set: CATALOGUE'
      - url: https://catalogue.bib.ens.psl.eu/opac/oai.pl?verb=Identify
        status: 404
        note: 'the baseURL the repository advertises for itself is not reachable — reported as a defect, not a conformance'
  - standard: oai-pmh
    status: conformant
    x-operator: tenant
    detail: >-
      ENS research output is harvestable as an OAI-PMH set on the national HAL platform operated by
      CCSD/CNRS. The set `collection:ENS-PARIS` resolves and returns ENS records. The protocol
      endpoint is CCSD's; the collection and its deposits are ENS's.
    evidence:
      - url: 'https://api.archives-ouvertes.fr/oai/hal/?verb=ListIdentifiers&metadataPrefix=oai_dc&set=collection:ENS-PARIS'
        status: 200
        note: 'returns headers carrying setSpec collection:ENS-PARIS'
      - url: https://api.archives-ouvertes.fr/oai/hal/?verb=Identify
        status: 200
        note: 'repositoryName HAL, repositoryIdentifier hal.archives-ouvertes.fr, adminEmail contact@archives-ouvertes.fr — CCSD, not ENS'
absent:
  - standard: scim
    detail: No SCIM endpoint found on any ENS-PSL host; provisioning is not publicly exposed.
  - standard: lti
    detail: >-
      moodle.ens.psl.eu is a live institution-hosted Moodle with a SAML SP in RENATER, but every
      probed LTI path (/mod/lti/auth.php, /.well-known/lti-configuration) 301s to the site home,
      so no LTI platform configuration is publicly readable. Not claimed.
    evidence:
      - url: https://moodle.ens.psl.eu/mod/lti/auth.php
        status: 301
        note: 'redirects to site home — no readable LTI configuration'
  - standard: oneroster
    detail: Not found.
  - standard: ed-fi
    detail: Not found.
  - standard: caliper
    detail: Not found.
  - standard: qti
    detail: Not found.
  - standard: orcid
    detail: >-
      ENS author records carry ORCID iDs inside HAL, but that is HAL's implementation on CCSD's
      platform, not an ENS-operated ORCID integration. Not claimed for the institution.
  - standard: datacite
    detail: >-
      DOIs for ENS deposits are minted through HAL/CCSD. No ENS-operated DataCite client or
      repository prefix was found.
  - standard: crossref
    detail: Not found under any ENS-PSL host.
