vocabulary:
  name: ENS-PSL Programmable Surface Vocabulary
  description: >-
    Controlled vocabulary for the machine-readable surfaces École Normale Supérieure - PSL
    actually operates or participates in: the institution's SAML/Shibboleth identity provider,
    the ENS-PSL library catalogue (Koha REST + OAI-PMH), and the ENS-PARIS collection inside the
    national HAL open archive. Terms are drawn from responses observed live on 2026-08-30. A
    previous version of this file was built from the French Ministry (MESR) Opendatasoft Explore
    API — a contract ENS does not operate — and has been replaced.
  version: 2.0.0
  generated: '2026-08-30'
  method: derived
  source: live probe responses from federation.ens.psl.eu, catalogue.bib.ens.psl.eu and api.archives-ouvertes.fr
  terms:
    - term: entityID
      definition: >-
        The SAML identifier of the ENS-PSL identity provider,
        https://federation.ens.psl.eu/idp/shibboleth, used by service providers to address it.
      tags: [saml, shibboleth, identity-federation]
    - term: scope
      definition: >-
        shibmd:Scope value asserted by the ENS-PSL IdP — `ens.fr` and `ens.psl.eu` — declaring the
        domains for which it may assert scoped attributes.
      tags: [saml, shibboleth, attributes]
    - term: SingleSignOnService
      definition: >-
        SAML endpoint at which the ENS-PSL IdP accepts authentication requests, published for the
        HTTP-POST and HTTP-Redirect bindings.
      tags: [saml, endpoint]
    - term: federation
      definition: >-
        The RENATER Fédération Éducation-Recherche, the French national identity federation whose
        metadata aggregate carries the ENS-PSL entity.
      tags: [identity-federation, renater]
    - term: library_id
      definition: >-
        Koha branch code identifying one of the ENS-PSL libraries (for example `APC` for the
        Montrouge agrégation library), returned by /api/v1/public/libraries.
      tags: [library, koha, identifier]
    - term: biblio
      definition: >-
        A bibliographic record in the ENS-PSL Koha catalogue, the unit addressed by the public
        REST routes and exported over OAI-PMH.
      tags: [library, koha, record]
    - term: item
      definition: A physical or electronic copy attached to a biblio in the ENS-PSL catalogue.
      tags: [library, koha, holdings]
    - term: setSpec
      definition: >-
        OAI-PMH set identifier. The ENS-PSL catalogue exposes one, `CATALOGUE`; the national HAL
        provider exposes ENS output as `collection:ENS-PARIS`.
      tags: [oai-pmh, harvesting]
    - term: metadataPrefix
      definition: >-
        OAI-PMH metadata format requested by a harvester, e.g. `oai_dc`, supported by both the
        ENS-PSL catalogue and HAL.
      tags: [oai-pmh, metadata]
    - term: resumptionToken
      definition: OAI-PMH continuation token for paging a harvest of ENS records.
      tags: [oai-pmh, paging]
    - term: collection
      definition: >-
        A HAL portal grouping. `ENS-PARIS` is the ENS collection; it is ENS's curation on CCSD's
        platform, not an ENS-operated endpoint.
      tags: [hal, repository, tenant]
    - term: docid
      definition: HAL internal identifier of a deposit returned by the HAL Search API.
      tags: [hal, identifier]
